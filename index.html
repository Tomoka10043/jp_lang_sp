<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語会話体験授業</title>

    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #333;
            font-family: sans-serif;
        }

        .slider-container {
            width: 95%;
            max-width: 800px;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .slider {
            display: flex;
            transition: transform 0.4s ease-in-out;
        }

        .slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img-wrapper {
            position: relative;
            width: 100%;
        }

        .img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            background: rgba(253, 253, 253, 0.2); 
            transition: background 0.2s;
        }
        .hotspot:hover {
            background: rgba(253, 253, 253, 0.4);
        }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            font-size: 26px;
            background: rgba(0,0,0,0.5);
            color: white;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .prev { left: 10px; }
        .next { right: 10px; }
        .nav:hover { background: rgba(0,0,0,0.8); }

        .indicator {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            padding: 6px 10px;
            border-radius: 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #aaa;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dot.active { background: white; }
    </style>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MK9B8TR3X3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-MK9B8TR3X3');
    </script>

    <!-- jsQR Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>

<div class="slider-container">

    <button class="nav prev" id="navPrev" aria-label="Previous slide">‹</button>
    <button class="nav next" id="navNext" aria-label="Next slide">›</button>

    <div class="slider" id="slider">
        <!-- 1番目のスライド -->
        <div class="slide">
            <div class="img-wrapper">
                <img src="./img/1.png" alt="Japanese group class">
                <a href="#" class="hotspot qr-link" data-qr="./img/qr_code_kakao.png"
                   style="top:59%; left:33%; width:24%; height:3%;" aria-label="Kakao QR"></a>
                <a href="https://www.instagram.com/japanese_study_room_0919" target="_blank" rel="noopener noreferrer"
                   class="hotspot"
                   style="top:63%; left:33%; width:18%; height:3.5%;" aria-label="Instagram"></a>
            </div>
        </div>

        <!-- 2番目のスライド -->
        <div class="slide">
            <div class="img-wrapper">
                <img src="./img/2.png" alt="Japanese one to one class">
                <a href="#" class="hotspot qr-link" data-qr="./img/qr_code_kakao.png"
                   style="top:60%; left:33%; width:25%; height:3%;" aria-label="Kakao QR"></a>
                <a href="https://www.instagram.com/japanese_study_room_0919" target="_blank" rel="noopener noreferrer"
                   class="hotspot"
                   style="top:63.5%; left:33%; width:18%; height:3.5%;" aria-label="Instagram"></a>
            </div>
        </div>
    </div>

    <!-- インジケータ -->
    <div class="indicator" id="indicator"></div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const slider = document.getElementById("slider");

        // 이미지 존재 여부 확인 함수
        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // info_03부터 시작해서 파일이 존재하는 동안 계속 슬라이드 동적 생성 (있는 만큼 루프)
        let i = 3;
        while (true) {
            const paddedNum = String(i).padStart(2, '0'); // 3 -> "03", 10 -> "10", 11 -> "11"...
            const imgSrc = `./img/info_${paddedNum}.png`;
            
            const exists = await checkImageExists(imgSrc);
            if (!exists) break; // 파일이 없으면 루프 탈출

            const slideDiv = document.createElement("div");
            slideDiv.classList.add("slide");
            slideDiv.innerHTML = `
                <div class="img-wrapper">
                    <img src="${imgSrc}" alt="Japanese language info ${i}">
                </div>
            `;
            slider.appendChild(slideDiv);
            i++;
        }

        const slides = document.querySelectorAll(".slide");
        const indicatorContainer = document.getElementById("indicator");
        const btnNext = document.getElementById("navNext");
        const btnPrev = document.getElementById("navPrev");
        
        let currentIndex = 0;
        const totalSlides = slides.length;

        // 인지케이터(점) 동적 생성
        slides.forEach((_, idx) => {
            const dot = document.createElement("div");
            dot.classList.add("dot");
            if (idx === 0) dot.classList.add("active");
            dot.addEventListener("click", () => goToSlide(idx));
            indicatorContainer.appendChild(dot);
        });
        const dots = document.querySelectorAll(".dot");

        function updateDots() {
            dots.forEach((dot, idx) => {
                dot.classList.toggle("active", idx === currentIndex);
            });
        }

        function goToSlide(index) {
            if (index >= totalSlides) {
                currentIndex = 0;
            } else if (index < 0) {
                currentIndex = totalSlides - 1;
            } else {
                currentIndex = index;
            }
            slider.style.transform = `translateX(-${currentIndex * 100}%)`;
            updateDots();
        }

        btnNext.addEventListener("click", () => goToSlide(currentIndex + 1));
        btnPrev.addEventListener("click", () => goToSlide(currentIndex - 1));

        // 모바일 터치(스와이프)
        let touchStartX = 0;
        slider.addEventListener("touchstart", (e) => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        slider.addEventListener("touchend", (e) => {
            let touchEndX = e.changedTouches[0].clientX;
            let diff = touchStartX - touchEndX;
            if (diff > 50) {
                goToSlide(currentIndex + 1);
            } else if (diff < -50) {
                goToSlide(currentIndex - 1);
            }
        });

        let isProcessingQR = false;

        // 보안이 적용된 QR코드 리다이렉트 함수
        function handleQRCode(imageSrc) {
            if (isProcessingQR) return;
            isProcessingQR = true;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = imageSrc;
            
            img.onload = () => {
                try {
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const qrCodeResult = jsQR(imgData.data, canvas.width, canvas.height);
                    
                    if (qrCodeResult) {
                        let qrDataUrl = qrCodeResult.data;

                        // URL 형식 및 프로토콜 검증 (오픈 리다이렉트 방지)
                        try {
                            const parsedUrl = new URL(qrDataUrl);
                            if (parsedUrl.protocol !== "https:" && parsedUrl.protocol !== "http:") {
                                throw new Error("Invalid protocol");
                            }
                        } catch (err) {
                            alert("安全ではないURLが検出されました。");
                            isProcessingQR = false;
                            return;
                        }

                        qrDataUrl += (qrDataUrl.includes("?") ? "&" : "?") + "id=qr_only_access";
                        
                        if (typeof gtag === 'function') {
                            gtag('event', 'qr_click', { 'event_label': imageSrc });
                        }
                        
                        // 탭나핑 방지 처리
                        const newWindow = window.open('', '_blank');
                        if (newWindow) {
                            newWindow.opener = null;
                            newWindow.location.href = qrDataUrl;
                        }
                    } else {
                        alert("QRコードが見つかりませんでした。");
                    }
                } catch (err) {
                    console.error(err);
                    alert("処理中にエラーが発生しました。");
                }
                isProcessingQR = false;
            };

            img.onerror = () => {
                alert("QR画像の読み込みに失敗しました。");
                isProcessingQR = false;
            };
        }

        document.querySelectorAll(".qr-link").forEach(link => {
            link.addEventListener("click", (e) => {
                e.preventDefault();
                handleQRCode(link.dataset.qr);
            });
        });
    });
</script>
</body>
</html>
